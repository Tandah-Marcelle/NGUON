server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Social crawlers requesting /?news=ID get OG preview HTML from backend
    location = / {
        set $is_bot 0;
        if ($arg_news) {
            set $is_bot 1;
        }
        if ($http_user_agent ~* "(whatsapp|facebookexternalhit|facebot|twitterbot|linkedinbot|telegrambot|slackbot|discordbot|applebot|googlebot|bingbot|pinterest)") {
            set $is_bot "${is_bot}bot";
        }
        if ($is_bot = "1bot") {
            proxy_pass http://nguon-backend:8080/api/actualities/preview/$arg_news;
        }
        try_files $uri /index.html;
    }

    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        try_files $uri =404;
    }

    error_page 404 /index.html;
}
